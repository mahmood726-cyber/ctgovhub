name: CT.gov hub catalogue and link checks
on:
  push:
  pull_request:
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - name: Parse inline JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/ctgovhub.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/ctgovhub.js
